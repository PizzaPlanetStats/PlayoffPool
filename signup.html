<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up - Pizza Planet</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="logo.png">
</head>
<body>
<div id="page">

  <div id="banner">
    <h1><img src="logo-big.png" alt="Pizza Planet"></h1>
    <h2>Pizza Planet Playoff Pool</h2>
  </div>

  <div id="nav">
    <a href="index.html">Home</a>
    <a href="standings.html">Standings</a>
    <a href="history.html">Past Years</a>
    <a href="rules.html">Rules</a>
    <a href="signin.html" id="auth-link">Sign In</a>
  </div>

  <div id="content">
    <div class="box">
      <h3>Create Your Team</h3>
      <div id="login-box">
        <form id="signup-form" class="simple" novalidate>
          <label for="team">Team name</label>
          <input type="text" id="team" maxlength="30" autocomplete="off" required>

          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>

          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" required>

          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" required>

          <label for="code">League code</label>
          <input type="text" id="code" autocomplete="off" required>

          <p id="message" class="error" role="alert"></p>
          <button type="submit" id="submit" class="btn">Sign Up</button>
        </form>
        <p class="fine">Get the league code from Jack to create a team.</p>
        <p class="fine">Already have a team? <a href="signin.html">Sign in</a>.</p>
      </div>
    </div>
  </div>

  <div id="footer">
    PizzaPlanetStats&trade;
  </div>

</div>
<script src="stars.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="signup.js"></script>
</body>
</html>
