<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - Pizza Planet</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="page">

  <div id="banner">
    <h1><img src="logo.png" alt="Pizza Planet"></h1>
    <h2>Pizza Planet Playoff Pool</h2>
  </div>

  <div id="nav">
    <a href="index.html">Home</a>
    <a href="standings.html">Standings</a>
    <a href="history.html">Past Years</a>
    <a href="rules.html">Rules</a>
    <a href="signin.html" id="auth-link">Sign In</a>
  </div>

  <div id="content">
    <div class="box">
      <h3>Sign In</h3>
      <div id="login-box">
        <form id="signin-form" class="simple" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>

          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>

          <p id="message" class="error" role="alert"></p>
          <button type="submit" id="submit" class="btn">Sign In</button>
        </form>
        <p class="fine"><a href="#" id="forgot">Forgot your password?</a></p>
        <p class="fine">New team? <a href="signup.html">Sign up here</a>.</p>
        <p class="fine">Admin only <a href="admin.html">Sign in here</a>.</p>
      </div>
    </div>
  </div>

  <div id="footer">
    PizzaPlanetStats&trade;
  </div>

</div>
<script src="stars.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="signin.js"></script>
</body>
</html>
