<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Team - Pizza Planet</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="logo.png">
</head>
<body>
<div id="page">

  <div id="banner">
    <h1><img src="logo-big.png" alt="Pizza Planet"></h1>
    <h2>League Team</h2>
  </div>

  <div id="nav">
    <a href="index.html">Home</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="signin.html" id="auth-link">Sign In</a>
  </div>

  <div id="content">
    <p id="status">Loading...</p>

    <div id="team-area" class="hidden">
      <div class="box team-card">
        <div class="team-row team-row-big">
          <span class="thumb-box big" id="logo-box"></span>
          <h2 id="team-name" class="team-name"></h2>
        </div>
        <p id="team-sub" class="team-sub"></p>
        <p id="team-links"></p>
      </div>

      <div class="box total-box">
        <span class="total-label">Total Points</span>
        <span id="total-points" class="total-value"></span>
      </div>

      <div class="box">
        <h3>Players</h3>
        <div id="players-table"></div>
      </div>

      <div class="box">
        <h3>Goalies</h3>
        <div id="goalies-table"></div>
      </div>

      <div class="box">
        <h3>Bracket Prediction</h3>
        <p id="bracket-total" class="hint"></p>
        <div id="bracket"></div>
      </div>
    </div>
  </div>

  <div id="footer">
    PizzaPlanetStats&trade;
  </div>

</div>
<script src="stars.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="leagueTeam.js"></script>
</body>
</html>
