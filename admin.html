<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login - Pizza Planet</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="page">

  <div id="banner">
    <h1><img src="logo-big.png" alt="Pizza Planet"></h1>
    <h2>Admin Login</h2>
  </div>

  <div id="nav">
    <a href="index.html">Home</a>
    <a href="standings.html">Standings</a>
    <a href="history.html">Past Years</a>
    <a href="rules.html">Rules</a>
    <a href="signin.html" id="auth-link">Sign In</a>
  </div>

  <div id="content">
    <div class="box">
      <h3>Admin Login</h3>
      <div id="login-box">
        <form id="login-form" class="simple" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>

          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>

          <p id="error" class="error" role="alert"></p>
          <button type="submit" id="submit" class="btn">Login</button>
        </form>
      </div>
    </div>
  </div>

  <div id="footer">
    PizzaPlanetStats&trade;
  </div>

</div>
<script src="stars.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
